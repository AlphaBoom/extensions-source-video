name: RouVideo response diagnostics

on:
  push:
    branches: [codex/rouvideo-diagnostics]
    paths:
      - '.github/workflows/rouvideo-diagnostics.yml'
      - '.github/scripts/fetch-rouvideo.py'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch source responses
        env:
          ROUVIDEO_PROXY_CONFIG: ${{ secrets.ROUVIDEO_PROXY_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          proxy_dir="$(mktemp -d)"
          cleanup() {
            if [[ -f "$proxy_dir/pid" ]]; then
              kill "$(cat "$proxy_dir/pid")" 2>/dev/null || true
            fi
            rm -rf "$proxy_dir"
          }
          trap cleanup EXIT
          if [[ -n "$ROUVIDEO_PROXY_CONFIG" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends shadowsocks-libev
            python .github/scripts/fetch-rouvideo.py --proxy-config "$proxy_dir/config.json"
            ss-local -c "$proxy_dir/config.json" -b 127.0.0.1 -l 1080 -f "$proxy_dir/pid" >"$proxy_dir/client.log" 2>&1
            export ROUVIDEO_SOCKS_PROXY=127.0.0.1:1080
          fi
          unset ROUVIDEO_PROXY_CONFIG
          python .github/scripts/fetch-rouvideo.py --output rouvideo-responses

      - name: Upload original responses
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rouvideo-responses
          path: rouvideo-responses/
          retention-days: 1
          if-no-files-found: error

  verify:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/rouvideo-tanstack
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rouvideo-responses
          path: rouvideo-responses

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Format, build, and verify against live responses
        env:
          CI: true
          CI_MODULES: ':src:all:rouvideo'
        run: |
          export ROUVIDEO_FIXTURES="$GITHUB_WORKSPACE/rouvideo-responses"
          chmod +x ./gradlew
          ./gradlew :src:all:rouvideo:formatKotlin :src:all:rouvideo:assembleDebug :src:all:rouvideo:testDebugUnitTest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rouvideo-verified-source
          retention-days: 1
          path: |
            src/all/rouvideo/src/
            src/all/rouvideo/test/
            src/all/rouvideo/build.gradle
            src/all/rouvideo/build/outputs/apk/debug/*.apk
            src/all/rouvideo/build/test-results/testDebugUnitTest/*.xml
