[versions]
# Used in [/gradle/build-logic/src/main/kotlin/AndroidBasePlugin.kt]
# Matches the Aniyomi host (minSdk 26) and the bytecode level of extensions-lib v17.
android-sdk-min = "26"
android-sdk-compile = "37"
android-sdk-target = "37"
android-build-tools = "37.0.0"
java = "17"

[plugins]
android-base = { id = "kei.plugins.android.base" }
extension = { id = "kei.plugins.extension" }
library = { id = "kei.plugins.library" }
spotless = { id = "kei.plugins.spotless" }
multisrc = { id = "kei.plugins.theme" }
